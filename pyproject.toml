[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralforge"
version = "0.1.0"
description = "Learning laboratory for neural operators and HPC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1.0",
  "numpy>=1.24.0",
  "scipy>=1.11.0",
  "einops>=0.7.0",
  "pyyaml>=6.0",
  "tqdm>=4.65.0",
  "h5py>=3.9.0",
  "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.1.0",
  "black>=23.0.0",
  "isort>=5.12.0",
  "pre-commit>=3.4.0",
]
mlops = [
  "mlflow>=2.8.0",
  "dvc>=3.25.0",
]
hpc = [
  "mpi4py>=3.1.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["neuralforge*"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py310", "py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=neuralforge --cov-report=term-missing"
